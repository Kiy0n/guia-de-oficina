name: guia-de-oficina

services:
  # -------------------------------------------------------------------------
  # Desenvolvimento: hot reload do front (Vite) e do back (tsx watch)
  #   docker compose up dev
  #   -> http://localhost:5173  (front, /api e /manuals são proxiados para o Express)
  #   -> http://localhost:3001/api/health
  # -------------------------------------------------------------------------
  dev:
    build:
      context: .
      target: dev
    image: guia-de-oficina:dev
    container_name: guia-de-oficina-dev
    ports:
      - "5173:5173"
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      API_PORT: 3001
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      # node_modules fica dentro do container (volume nomeado) para não
      # conflitar com o host, que não possui Node.js instalado.
      - node_modules:/app/node_modules
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Produção: Express 5 servindo a API, os manuais PDF e o build estático do React
  #   docker compose --profile prod up --build prod
  #   -> http://localhost:8080
  # -------------------------------------------------------------------------
  prod:
    profiles: ["prod"]
    build:
      context: .
      target: prod
    image: guia-de-oficina:latest
    container_name: guia-de-oficina-prod
    ports:
      - "8080:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
    volumes:
      - ./data:/app/data
      - ./public/manuals:/app/public/manuals:ro
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Testes E2E & API (Playwright em container isolado na mesma rede do dev)
  #   docker compose --profile test run --rm playwright
  # -------------------------------------------------------------------------
  playwright:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.playwright
    image: guia-de-oficina:playwright
    container_name: guia-de-oficina-playwright
    depends_on:
      - dev
    environment:
      BASE_URL: http://dev:5173
      API_URL: http://dev:3001
      CI: "true"
    volumes:
      - .:/workspace/app
    ipc: host

volumes:
  node_modules:
